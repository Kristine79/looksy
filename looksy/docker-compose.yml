version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: looksy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: looksy
    ports:
      - "5432:5432"
    volumes:
      - looksy-postgres-data:/var/lib/postgresql/data

volumes:
  looksy-postgres-data:
